services:
  # 1. Cơ sở dữ liệu PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: fintracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fintracker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fintracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fintracker-net

  # 2. Golang High-Performance Backend Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintracker-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_DRIVER: "postgres"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-fintracker}
      DB_SSLMODE: "disable"
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fintracker-net

  # 3. React Frontend Nginx SPA (Port 7173)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintracker-frontend
    restart: unless-stopped
    ports:
      - "7173:7173"
    depends_on:
      - backend
    networks:
      - fintracker-net

  # 4. (Tùy chọn) Cloudflare Zero Trust Tunnel - Kết nối Internet & HTTPS miễn phí
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: fintracker-tunnel
  #   restart: unless-stopped
  #   command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - fintracker-net

volumes:
  pgdata:
    driver: local

networks:
  fintracker-net:
    driver: bridge
