name: CI/CD Auto Deploy on PR Merge to Server

# 1. Chỉ lắng nghe sự kiện khi Pull Request vào nhánh 'server' bị đóng (closed)
on:
  pull_request:
    types:
      - closed
    branches:
      - server
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên web GitHub khi cần

jobs:
  deploy:
    # 2. ĐIỀU KIỆN QUAN TRỌNG: Chỉ chạy khi PR thực sự được MERGE (merged == true)
    # Nếu ai đó bấm Close/Hủy PR mà không merge thì workflow sẽ BỎ QUA (không chạy)
    if: (github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch')
    
    name: Build & Deploy on Home Server
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout Repository (Nhánh server)
        uses: actions/checkout@v4
        with:
          ref: server

      - name: ⚙️ Setup Environment Files
        shell: powershell
        run: |
          if (-not (Test-Path "backend/.env")) {
            Write-Host "Copying backend/.env.example to backend/.env"
            Copy-Item "backend/.env.example" "backend/.env"
          }
          if (-not (Test-Path "frontend/.env")) {
            Write-Host "Copying frontend/.env.example to frontend/.env"
            Copy-Item "frontend/.env.example" "frontend/.env"
          }

      - name: 🐳 Deploy Containers with Docker Compose
        shell: powershell
        run: |
          docker compose down --remove-orphans
          docker compose up -d --build --remove-orphans

      - name: 🧹 Cleanup Old Dangling Docker Images
        shell: powershell
        run: |
          docker image prune -f

      - name: 🩺 Verify Healthcheck
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          docker compose ps

      # ==================== DISCORD NOTIFICATIONS ====================
      - name: 📢 Notify Discord on Success
        if: success()
        shell: powershell
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK || 'https://discord.com/api/webhooks/1557693587209060452/3pSWz8wzVXtoXem3TApx9CmEOhtj8H53sa6Ic6gf_L6sM7YeuFGnpffzZJV3NJ6PwOiB' }}
        run: |
          $shortSha = if ("${{ github.sha }}".Length -ge 7) { "${{ github.sha }}".Substring(0, 7) } else { "${{ github.sha }}" }
          $body = @{
            username = "FinTracker Deploy Bot"
            avatar_url = "https://cdn-icons-png.flaticon.com/512/2534/2534204.png"
            embeds = @(
              @{
                title = "🚀 FinTracker Deploy Thành Công!"
                description = "Hệ thống FinTracker đã được build & triển khai container thành công trên Home Server."
                color = 3066993 # Màu xanh lá (0x2ECC71)
                fields = @(
                  @{ name = "📦 Kho Mã Nguồn"; value = "${{ github.repository }}"; inline = $true },
                  @{ name = "🌿 Nhánh / Commit"; value = "${{ github.ref_name }} (`$shortSha`)"; inline = $true },
                  @{ name = "👤 Người Kích Hoạt"; value = "${{ github.actor }}"; inline = $true },
                  @{ name = "⚙️ Trạng Thái"; value = "✅ **DEPLOY SUCCESS (Hoạt động)**"; inline = $true },
                  @{ name = "🌐 Dịch Vụ Khởi Chạy"; value = "• Frontend Nginx (Port 7173)`n• Go Backend (Port 8080)`n• PostgreSQL 16 (Port 5432)"; inline = $false },
                  @{ name = "🔗 Chi Tiết CI/CD"; value = "[Xem GitHub Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"; inline = $false }
                )
                footer = @{ text = "FinTracker CI/CD Pipeline • Windows Home Server" }
                timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              }
            )
          } | ConvertTo-Json -Depth 5

          try {
            $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -Body $utf8 -ContentType "application/json; charset=utf-8"
            Write-Host "✅ Đã gửi thông báo thành công đến Discord!"
          } catch {
            Write-Warning "⚠️ Không thể gửi thông báo đến Discord: $_"
          }

      - name: 🚨 Notify Discord on Failure
        if: failure()
        shell: powershell
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK || 'https://discord.com/api/webhooks/1557693587209060452/3pSWz8wzVXtoXem3TApx9CmEOhtj8H53sa6Ic6gf_L6sM7YeuFGnpffzZJV3NJ6PwOiB' }}
        run: |
          $shortSha = if ("${{ github.sha }}".Length -ge 7) { "${{ github.sha }}".Substring(0, 7) } else { "${{ github.sha }}" }
          $body = @{
            username = "FinTracker Deploy Bot"
            avatar_url = "https://cdn-icons-png.flaticon.com/512/2534/2534204.png"
            embeds = @(
              @{
                title = "🚨 FinTracker Deploy Thất Bại!"
                description = "Quá trình build hoặc triển khai FinTracker gặp lỗi trên Home Server."
                color = 15158332 # Màu đỏ (0xE74C3C)
                fields = @(
                  @{ name = "📦 Kho Mã Nguồn"; value = "${{ github.repository }}"; inline = $true },
                  @{ name = "🌿 Nhánh / Commit"; value = "${{ github.ref_name }} (`$shortSha`)"; inline = $true },
                  @{ name = "👤 Người Kích Hoạt"; value = "${{ github.actor }}"; inline = $true },
                  @{ name = "⚙️ Trạng Thái"; value = "❌ **DEPLOY FAILED (Gặp lỗi)**"; inline = $true },
                  @{ name = "🔍 Xem Log Lỗi"; value = "[Nhấn vào đây để xem chi tiết lỗi](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"; inline = $false }
                )
                footer = @{ text = "FinTracker CI/CD Pipeline • Windows Home Server" }
                timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              }
            )
          } | ConvertTo-Json -Depth 5

          try {
            $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
            Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -Body $utf8 -ContentType "application/json; charset=utf-8"
            Write-Host "✅ Đã gửi thông báo lỗi đến Discord!"
          } catch {
            Write-Warning "⚠️ Không thể gửi thông báo đến Discord: $_"
          }
